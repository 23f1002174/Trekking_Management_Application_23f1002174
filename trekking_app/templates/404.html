{% extends "base.html" %}
{% block title %}Page Not Found | Trekking Management{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh;">
  <div class="text-center" style="max-width:420px;">
    <div style="width:80px;height:80px;background:var(--clr-primary-light);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--clr-primary);margin:0 auto 1.5rem;">
      <i class="bi bi-compass"></i>
    </div>
    <h1 class="display-1 fw-bold" style="color:var(--clr-primary);letter-spacing:-0.04em;">404</h1>
    <h2 class="h4 fw-bold mb-2">Page Not Found</h2>
    <p class="text-secondary mb-4">The page you're looking for doesn't exist or has been moved. Let's get you back on the trail.</p>
    <div class="d-flex justify-content-center gap-2">
      <a class="btn btn-success" href="{{ url_for('main.home') }}"><i class="bi bi-house me-1"></i>Home</a>
      <a class="btn btn-outline-success" href="{{ url_for('auth.login') }}"><i class="bi bi-box-arrow-in-right me-1"></i>Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
