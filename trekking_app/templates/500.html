{% extends "base.html" %}
{% block title %}Server Error | Trekking Management{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh;">
  <div class="text-center" style="max-width:420px;">
    <div style="width:80px;height:80px;background:var(--clr-danger-light);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--clr-danger);margin:0 auto 1.5rem;">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h1 class="display-1 fw-bold" style="color:var(--clr-danger);letter-spacing:-0.04em;">500</h1>
    <h2 class="h4 fw-bold mb-2">Something went wrong</h2>
    <p class="text-secondary mb-4">We're working on fixing the problem. Please try again in a few moments.</p>
    <a class="btn btn-success" href="{{ url_for('main.home') }}"><i class="bi bi-house me-1"></i>Back to Home</a>
  </div>
</div>
{% endblock %}
